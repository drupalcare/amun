# Config schema for the Amun theme settings.
#
# The key list is the base theme's (drupal8_w3css_theme 3.0 or later): this
# type reuses its definition, so the two cannot drift. Needs drupal/d8w3css
# ^3.0 installed, as composer.json requires.
amun.settings:
  type: drupal8_w3css_theme.settings
  label: 'Amun theme settings'
